<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16213e" />

    <title>Code the Robot: Free Programming Puzzle Game</title>
    <meta
      name="description"
      content="Code the Robot is a free programming puzzle game. Guide a robot with loops, conditions, functions and variables across 75 levels. Think. Code. Execute."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Code the Robot" />
    <meta property="og:title" content="Code the Robot: Think. Code. Execute." />
    <meta
      property="og:description"
      content="Solve programming puzzles, guide the robot and level up your coding skills. 75 levels, free to play."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Code the Robot: Think. Code. Execute." />
    <meta
      name="twitter:description"
      content="Solve programming puzzles, guide the robot and level up your coding skills."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Code the Robot",
        "url": "%VITE_SITE_URL%/",
        "description": "A free programming puzzle game. Guide a robot with loops, conditions, functions and variables across 75 levels.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (web browser)",
        "genre": ["Puzzle", "Educational"],
        "inLanguage": ["en", "id"],
        "image": "%VITE_SITE_URL%/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <style>
      body {
        margin: 0;
        background: #16213e;
      }
      .boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        color: #a9b6d6;
        font-family: system-ui, sans-serif;
        font-weight: 700;
      }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffc21a;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-spinner"></div>
        <p>Loading Code the Robot…</p>
      </div>
    </div>
    <noscript>
      <h1>Code the Robot: Think. Code. Execute.</h1>
      <p>
        Code the Robot is a free programming puzzle game. Arrange commands to
        guide a robot to the goal, and learn sequences, loops, conditions,
        functions and variables across 75 levels in 5 worlds.
      </p>
      <p>JavaScript is required to play the game.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
